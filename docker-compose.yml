services:
  hand-tracker:
    build: .
    image: hand-tracker:latest
    container_name: hand_tracker
    network_mode: host
    ipc: host
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
    devices:
      - ${VIDEO_DEVICE:-/dev/video0}:/dev/video0
    stdin_open: true
    tty: true
